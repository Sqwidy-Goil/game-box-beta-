<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#12202b;--card:#ffffff;--line:#c3d6e0;--accent:#1f7ae0;--page:#dfeef5;--muted:#46606e;--sky1:#5fb8f5;--sky2:#d2f0ff;--pipe:#58b947;--pipe-edge:#2f7a2c;--ground:#dcc77f;--ground-edge:#7cbf3f;--cloud:#ffffffd9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf1f8;--card:#16202e;--line:#26364a;--accent:#4c9bff;--page:#0b111c;--muted:#8fa3b8;--sky1:#0a1a38;--sky2:#2b4b7d;--pipe:#3d9a49;--pipe-edge:#21662b;--ground:#8d7d4c;--ground-edge:#4c7a33;--cloud:#ffffff26}}
:root[data-theme="dark"]{--ink:#eaf1f8;--card:#16202e;--line:#26364a;--accent:#4c9bff;--page:#0b111c;--muted:#8fa3b8;--sky1:#0a1a38;--sky2:#2b4b7d;--pipe:#3d9a49;--pipe-edge:#21662b;--ground:#8d7d4c;--ground-edge:#4c7a33;--cloud:#ffffff26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--muted);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;top:0;right:0;bottom:0;left:0;margin:auto;display:block;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 12px 10px;text-align:center}
#snd,#back{flex:none;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation}
#snd:focus-visible,#back:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
#back{width:auto;padding:0 14px;border-radius:19px;font:600 14px system-ui,sans-serif}
#hub{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;overflow:auto;touch-action:pan-y;background:var(--page);color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 26px)}
.hubin{max-width:560px;margin:0 auto}
#hub h1{margin:0 0 20px;font:800 32px/1.05 'Trebuchet MS',system-ui,sans-serif;letter-spacing:-.01em}
#hub h2{margin:28px 0 12px;font:700 17px/1 system-ui,sans-serif}
.who{display:block}
.who span{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
#pseudo{box-sizing:border-box;width:100%;padding:13px 14px;font:600 18px system-ui,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
#pseudo:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:block;padding:8px 8px 14px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;cursor:pointer}
.card:active{transform:scale(.97)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card b{display:block;margin:10px 4px 2px;font-size:16px}
.card small{display:block;margin:0 4px;font-size:13px;color:var(--muted)}
.thumb{display:block;min-height:84px;aspect-ratio:4/3;border-radius:10px;background:radial-gradient(circle at 28% 48%,#ffd23f 0 8%,#a66d00 8.5% 10%,transparent 10.5%),linear-gradient(var(--pipe),var(--pipe)) 72% 0/16% 38% no-repeat,linear-gradient(var(--pipe),var(--pipe)) 72% 100%/16% 34% no-repeat,linear-gradient(var(--ground-edge),var(--ground-edge)) 0 100%/100% 14% no-repeat,linear-gradient(var(--sky1),var(--sky2))}
.thumb2{background:radial-gradient(circle at 72% 38%,#ffd23f 0 6%,transparent 7%),radial-gradient(circle at 28% 64%,#ffc233 0 10%,#7b4bd6 10.5% 15%,transparent 15.5%),linear-gradient(var(--ground-edge),var(--ground-edge)) 0 84%/100% 6% no-repeat,linear-gradient(var(--ground),var(--ground)) 0 100%/100% 16% no-repeat,linear-gradient(var(--sky1),var(--sky2))}
#pad{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;-webkit-touch-callout:none}
#pad[hidden]{display:none}
#pad div{display:flex;gap:14px}
#pad button{width:72px;height:72px;padding:0;border-radius:50%;border:2px solid var(--muted);background:var(--card);color:var(--ink);font:700 28px system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#pad button.on{background:var(--accent);color:var(--accent-ink)}
#pad #bj{width:104px;border-radius:36px;font-size:20px}
#skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.skin{display:flex;align-items:center;gap:8px;padding:9px 8px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 13px system-ui,sans-serif;cursor:pointer}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.skinbird{position:relative;display:inline-block;flex:none;width:30px;height:25px;border:2px solid #26313a;border-radius:50%;background:var(--bird)}
.skinbird:before{content:"";position:absolute;right:-9px;top:9px;border-left:10px solid #ff8b35;border-top:4px solid transparent;border-bottom:4px solid transparent}
.skinbird:after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:1px 1px 0 #222}
.soon{border-style:dashed;cursor:default;opacity:.75}
.soon .thumb{display:flex;align-items:center;justify-content:center;font:800 34px system-ui,sans-serif;color:var(--muted);background:var(--page)}

#doom-choice{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:#080914eF}
#doom-choice[hidden],#doom-controls[hidden]{display:none}
.doom-choice-card{width:min(100%,360px);padding:24px;border:1px solid #ff9a52;border-radius:20px;background:#191725;color:#fff;text-align:center;box-shadow:0 12px 40px #0009}
.doom-choice-card h2{margin:0 0 10px;font-size:22px}.doom-choice-card p{color:#ddd}
.doom-choice-card button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:12px;background:#ef7b3e;color:#171018;font-size:16px;font-weight:800}
.doom-choice-card #doom-cancel{background:#444052;color:#fff}
#doom-controls{position:fixed;inset:auto 0 58px 0;z-index:12;display:flex;align-items:end;justify-content:space-between;padding:0 22px;pointer-events:none;touch-action:none}
#joy-base{width:132px;height:132px;border:3px solid #ffffff88;border-radius:50%;background:#22263899;position:relative;pointer-events:auto;touch-action:none}
#joy-knob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#ffffffbb;border:2px solid #fff;box-shadow:0 2px 10px #0008;pointer-events:none}

@media (max-width:600px){#doom-controls{bottom:62px;padding:0 16px}#joy-base{width:124px;height:124px}#joy-knob{left:32px;top:32px}#doom-fire{width:82px;height:82px}}

 body.doom-mobile:after{content:"Tourne ton téléphone à l’horizontale pour jouer";position:fixed;z-index:14;left:50%;top:12px;transform:translateX(-50%);padding:9px 14px;border-radius:20px;background:#111827dd;color:#fff;font:600 13px system-ui;white-space:nowrap;pointer-events:none}
}

:root{--gb-bg:#080b14;--gb-panel:#111827;--gb-panel2:#151e30;--gb-line:#27344b;--gb-text:#f4f7ff;--gb-muted:#91a0b8;--gb-accent:#8b5cf6;--gb-cyan:#38d9e6}
body{background:var(--gb-bg);color:var(--gb-muted)}
#hub{background:
 radial-gradient(ellipse at 12% 0%,rgba(91,63,184,.23),transparent 42%),
 radial-gradient(ellipse at 100% 25%,rgba(20,169,190,.12),transparent 38%),
 linear-gradient(160deg,#080b14,#0b1020 60%,#080b14);

.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff0b,transparent 38%);pointer-events:none}
.card:active{transform:scale(.965)}

.doom-choice-card #doom-cancel{background:#30394c}
@keyframes gb-enter{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes gb-glow{0%,100%{box-shadow:0 0 0 #8b5cf600}50%{box-shadow:0 0 23px #8b5cf62b}}
#hub .hubin>*{animation:gb-enter .48s both}

.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}

@media(max-width:390px){#skins{grid-template-columns:repeat(2,minmax(0,1fr))}.brandname{font-size:23px}.grid{gap:9px}.thumb{min-height:88px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="wrap"><canvas id="c"></canvas><noscript><div style="position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px;line-height:1.4">Ce jeu a besoin de JavaScript. Ouvrez ce fichier dans un navigateur (Chrome, Safari ou Firefox) plutôt que dans un aperçu.</div></noscript></div>

<script>
window.addEventListener('error',e=>{const s=document.querySelector('#bar span');if(s)s.textContent='Erreur\u00A0: '+e.message});
let W=360,H=640,GH=90,PW=60,GAP=156,SPACE=205,R=13,BX=90,G=.42,JUMP=7.3,SPEED=2.6;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const V={sky1:'--sky1',sky2:'--sky2',pipe:'--pipe',pipeEdge:'--pipe-edge',ground:'--ground',groundEdge:'--ground-edge',cloud:'--cloud'},C={sky1:'#5fb8f5',sky2:'#d2f0ff',pipe:'#58b947',pipeEdge:'#2f7a2c',ground:'#dcc77f',groundEdge:'#7cbf3f',cloud:'#ffffffd9'};
let state,score=0,best=0,bird,pipes,ground=0,t=0,prev=0,deadAt=0;
const clouds=[{x:40,y:100,s:1},{x:210,y:180,s:.7},{x:300,y:60,s:.85}];
try{best=+localStorage.getItem('flappy-best')||0}catch(e){}

const snd=document.getElementById('snd'),hub=document.getElementById('hub'),nameIn=document.getElementById('pseudo');
let inGame=false,user='Joueur';
const birdSkins={classic:{body:'#ffd23f',edge:'#a66d00',wing:'#f4a300',beak:'#ff6f3c'},blue:{body:'#45b7ff',edge:'#176b9d',wing:'#168bd0',beak:'#ff9c35'},pink:{body:'#ff82bd',edge:'#a83d76',wing:'#e84f98',beak:'#ffad38'},ninja:{body:'#414957',edge:'#171d27',wing:'#252d3a',beak:'#e85b45'},gold:{body:'#ffc928',edge:'#a66d00',wing:'#f39b18',beak:'#ff6f3c'},alien:{body:'#70df86',edge:'#26844a',wing:'#39b65e',beak:'#a66bff'}};
let selectedSkin='classic';
try{selectedSkin=localStorage.getItem('flappy-skin')||'classic'}catch(e){}
if(!birdSkins[selectedSkin])selectedSkin='classic';
function chooseSkin(id){if(!birdSkins[id])return;selectedSkin=id;try{localStorage.setItem('flappy-skin',id)}catch(e){}document.querySelectorAll('.skin').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skin===id)));}

let muted=false,AC,master,sfxBus,musBus,nbuf,timer=0,mStep=0,nextT=0;
try{muted=localStorage.getItem('flappy-mute')==='1'}catch(e){}
const BEAT=60/132/2,hz=n=>261.63*Math.pow(2,n/12);
let MEL=[[16,19,16,12,14,16,12,null],[12,16,21,16,14,12,9,null],[17,21,17,12,14,17,12,null],[14,19,14,11,12,14,7,null]],BASS=[-12,-15,-19,-17];

function audio(){
  if(!AC){
    const A=window.AudioContext||window.webkitAudioContext;
    try{AC=new A()}catch(e){return}
    master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=.6;sfxBus.connect(master);
    musBus=AC.createGain();musBus.gain.value=.28;musBus.connect(master);
  }
  if(AC.state==='suspended')AC.resume();
}
function tone(f,t0,d,type,vol,bus,f2){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+d+.02);

  dp={x:1.7,y:1.7,a:0};da=0;dShots=0;dWon=false;
  dTargets=[{x:5.2,y:2.0,alive:true},{x:8.8,y:3.2,alive:true},{x:3.8,y:6.3,alive:true},{x:8.8,y:7.4,alive:true},{x:5.5,y:9.2,alive:true}];
  Object.keys(dKeys).forEach(k=>dKeys[k]=false);
}
function doomWall(x,y){const mx=Math.floor(x),my=Math.floor(y);return !doomMap[my]||doomMap[my][mx]==='#'}
function doomSfx(kind){
  if(muted)return;
  audio();if(!AC)return;
  const now=AC.currentTime;
  if(kind==='shot'){
    noise(now,.12,.34,700,sfxBus);
    tone(155,now,.16,'sawtooth',.23,sfxBus,58);
    tone(740,now,.055,'square',.10,sfxBus,260);
  }else if(kind==='hit'){
    tone(520,now,.10,'triangle',.20,sfxBus,180);
    tone(115,now+.035,.15,'sawtooth',.12,sfxBus,65);
  }else if(kind==='step'){
    noise(now,.065,.09,150,sfxBus);
    tone(78,now,.07,'triangle',.075,sfxBus,48);
  }else if(kind==='win'){
    [440,554,659,880].forEach((f,i)=>tone(f,now+i*.09,.18,'triangle',.13,sfxBus));

function doomShoot(){
  if(!inGame||game!=='doom')return;
  if(dWon){doomReset();return;}
  doomSfx('shot');
  dShots++;
  let best=null,bd=99;
  for(const e of dTargets){if(!e.alive)continue;const dx=e.x-dp.x,dy=e.y-dp.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-dp.a;const norm=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(norm)<.16&&dist<bd){best=e;bd=dist}}
  if(best)best.alive=false;

}
function doomFrame(k){
  if(!dWon){
    let turn=0,forward=0;
    if(doomMode==='mobile'){
      turn=joyAxisX;
      forward=-joyAxisY;
      dp.a+=turn*.022*k;
    }else{
      const rot=.045*k;
      if(dKeys.ArrowLeft||dKeys.KeyA)dp.a-=rot;
      if(dKeys.ArrowRight||dKeys.KeyD)dp.a+=rot;
      forward=((dKeys.KeyW||dKeys.ArrowUp)?1:0)-((dKeys.KeyS||dKeys.ArrowDown)?1:0);
    }
    const move=(doomMode==='mobile'?.047:.075)*k;
    if(forward){
      const nx=dp.x+Math.cos(dp.a)*move*forward,ny=dp.y+Math.sin(dp.a)*move*forward;
      if(!doomWall(nx,dp.y))dp.x=nx;
      if(!doomWall(dp.x,ny))dp.y=ny;
      stepClock+=k;
      if(stepClock>22){stepClock=0;doomSfx('step')}
    }else stepClock=0;
  }
  doomDraw();
}
function doomDraw(){
  const sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#080e18');sky.addColorStop(.58,'#202b36');sky.addColorStop(1,'#63413a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.55);
  const floor=ctx.createLinearGradient(0,H*.48,0,H);floor.addColorStop(0,'#45464a');floor.addColorStop(.35,'#252a31');floor.addColorStop(1,'#080b10');ctx.fillStyle=floor;ctx.fillRect(0,H*.48,W,H*.52);
  // Industrial floor seams and perspective hazard markings
  for(let r=1;r<=9;r++){const yy=H*.5+(H*.5)*(r/10)*(r/10);ctx.strokeStyle=`rgba(170,185,194,${.035+r*.008})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}
  for(let c=-8;c<=8;c++){ctx.strokeStyle='rgba(160,175,185,.045)';ctx.beginPath();ctx.moveTo(W/2+c*8,H*.5);ctx.lineTo(W/2+c*W*.11,H);ctx.stroke()}
  // Soft overhead industrial lamps and atmospheric haze
  const haze=ctx.createLinearGradient(0,H*.38,0,H*.62);haze.addColorStop(0,'rgba(255,164,104,.045)');haze.addColorStop(1,'rgba(4,8,14,0)');ctx.fillStyle=haze;ctx.fillRect(0,H*.35,W,H*.3);
  const zbuf=[];const fov=Math.PI/3;
  for(let x=0;x<W;x++){const ra=dp.a+(x/W-.5)*fov;let dist=0,hit=false,hx=0,hy=0;while(dist<18&&!hit){dist+=.025;hx=dp.x+Math.cos(ra)*dist;hy=dp.y+Math.sin(ra)*dist;hit=doomWall(hx,hy)}const corrected=dist*Math.cos(ra-dp.a);zbuf[x]=corrected;const wh=Math.min(H*1.4,H/(corrected*.78));const shade=Math.max(.16,1-corrected/12),top=(H-wh)/2;
    const side=Math.floor(hx+hy),brick=((Math.floor(hy*2)+Math.floor(hx*2))%2===0);
    const base=brick?[91,103,108]:[67,82,91];
    ctx.fillStyle=`rgb(${Math.floor(base[0]*shade)},${Math.floor(base[1]*shade)},${Math.floor(base[2]*shade)})`;ctx.fillRect(x,top,1,wh);
    // Repeating metal plates, recessed seams, bolts and amber warning strips
    const v=(Math.floor((top+wh*.22)/Math.max(8,wh*.16))%2);
    if(x%Math.max(12,Math.floor(W/55))===0){ctx.fillStyle=`rgba(5,9,14,${.42*shade})`;ctx.fillRect(x,top,1,wh)}
    if(v===0&&Math.abs(hx-Math.round(hx))<.035){ctx.fillStyle=`rgba(255,164,72,${.32*shade})`;ctx.fillRect(x,top+wh*.72,1,Math.max(1,wh*.025))}
    if((Math.floor(hx*4)+Math.floor(hy*4))%7===0&&x%17===0){ctx.fillStyle=`rgba(210,225,230,${.22*shade})`;ctx.fillRect(x,top+wh*.18,1,Math.max(1,wh*.012))}
    if(side%3===0&&x%Math.max(20,Math.floor(W/32))===0){ctx.fillStyle=`rgba(0,0,0,${.28*shade})`;ctx.fillRect(x,top+wh*.08,1,wh*.84)}}
  const visible=dTargets.filter(e=>e.alive).map(e=>({...e,dist:Math.hypot(e.x-dp.x,e.y-dp.y)})).sort((a,b)=>b.dist-a.dist);
  for(const e of visible){const dx=e.x-dp.x,dy=e.y-dp.y,ang=Math.atan2(dy,dx)-dp.a,norm=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(norm)>fov*.65)continue;const sx=(.5+norm/fov)*W,size=Math.min(100,H/(e.dist*.8));if(sx<0||sx>=W||e.dist>zbuf[Math.max(0,Math.min(W-1,Math.floor(sx)))])continue;ctx.save();ctx.translate(sx,H*.5);ctx.fillStyle='#ff8b45';ctx.shadowColor='#ff572f';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,-size*.15,size*.32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f8d6a0';ctx.fillRect(-size*.24,-size*.22,size*.48,size*.12);ctx.fillStyle='#251522';ctx.fillRect(-size*.14,-size*.2,size*.07,size*.06);ctx.fillRect(size*.07,-size*.2,size*.07,size*.06);ctx.fillStyle='#a83e4e';ctx.fillRect(-size*.22,size*.1,size*.44,size*.45);ctx.restore();}
  const vignette=ctx.createRadialGradient(W/2,H/2,H*.12,W/2,H/2,H*.78);
  vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.36)');
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('CIBLES : '+dTargets.filter(e=>e.alive).length+' / 5',12,22);ctx.textAlign='right';ctx.fillText('NIVEAU 1',W-12,22);
  ctx.strokeStyle='#ffd18a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-8,H/2);ctx.lineTo(W/2+8,H/2);ctx.moveTo(W/2,H/2-8);ctx.lineTo(W/2,H/2+8);ctx.stroke();
  if(dWon){ctx.fillStyle='rgba(8,10,20,.78)';ctx.fillRect(20,H/2-70,W-40,140);label('NIVEAU TERMINÉ !',H/2-12,25);label('Toutes les cibles sont neutralisées',H/2+22,13);label('Touchez ou Espace pour recommencer',H/2+50,12)}
  else{ctx.fillStyle='rgba(255,255,255,.65)';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('WASD : bouger  •  ← → : tourner  •  ESPACE : tir',W/2,H-14)}
}
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
addEventListener('keydown',e=>{if(inGame&&game==='plat'&&KM[e.code]){pk[KM[e.code]]=true;e.preventDefault()}});

[['bl','left'],['br','right'],['bj','jump']].forEach(([id,key])=>{
  const b=document.getElementById(id),on=e=>{e.preventDefault();e.stopPropagation();pk[key]=true;b.classList.add('on')},off=()=>{pk[key]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));
});

const doomChoice=document.getElementById('doom-choice');

let joyPointer=null;
function resetJoy(){joyPointer=null;joyAxisX=joyAxisY=0;dKeys.KeyW=dKeys.KeyS=dKeys.KeyA=dKeys.KeyD=false;joyKnob.style.transform='translate(0px,0px)'}
joyBase.addEventListener('pointerdown',e=>{if(!inGame||game!=='doom'||doomMode!=='mobile')return;joyPointer=e.pointerId;joyBase.setPointerCapture(e.pointerId);moveJoy(e)});
joyBase.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveJoy(e)});
function moveJoy(e){
  const r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  joyKnob.style.transform=`translate(${dx}px,${dy}px)`;
  const dead=0.22;
  const analog=v=>{const a=Math.max(-1,Math.min(1,v/max));if(Math.abs(a)<dead)return 0;const n=(Math.abs(a)-dead)/(1-dead);return Math.sign(a)*Math.pow(n,1.35)};
  joyAxisX=analog(dx);joyAxisY=analog(dy);
}
